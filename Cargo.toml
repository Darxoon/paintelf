[package]
name = "paintelf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
binrw = "0.15.1"
byteorder = "1.5.0"
indexmap = "2.13.0"
indoc = "2.0.6"
memchr = "2.7.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_bw = "2.5.4"
vivibin = { path = "vivibin" }

[lints.clippy]
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"

[profile.release]
panic = "abort"
strip = true
lto = true
